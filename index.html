<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호그와트 마법 단어장 (네이버 사전 팝업판)</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --magic-red: #740001;
            --magic-gold: #ae0001;
            --magic-yellow: #eeba30;
            --magic-dark: #1a1a1a;
            --magic-bg: #f4ebd9;
            --magic-green: #2e7d32;
            --naver-green: #03c75a;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--magic-bg);
            color: var(--magic-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 3px double var(--magic-red);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--magic-red);
            font-variant: small-caps;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--magic-red);
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background-color: var(--magic-red);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--magic-gold);
            color: var(--magic-yellow);
        }

        .mic-btn {
            background-color: #555;
            padding: 12px 15px;
        }
        .mic-btn.recording {
            background-color: #ff3b30;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .result-box {
            background: #faf6ee;
            padding: 15px;
            border-left: 5px solid var(--magic-yellow);
            margin-bottom: 30px;
            border-radius: 4px;
            min-height: 60px;
        }

        /* 🟢 네이버 버튼 전용 마법 스타일 */
        .naver-btn {
            background-color: var(--naver-green) !important;
            color: white !important;
            padding: 4px 10px !important;
            font-size: 13px !important;
            border-radius: 4px !important;
            margin-left: 8px;
            vertical-align: middle;
            font-weight: bold;
        }
        .naver-btn:hover {
            background-color: #02b34f !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .pronounce-btn {
            background-color: var(--magic-yellow);
            color: var(--magic-dark);
            padding: 4px 8px;
            font-size: 14px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .pronounce-btn:hover {
            background-color: var(--magic-red);
            color: white;
        }

        .history-audio-btn {
            background-color: transparent;
            color: var(--magic-dark);
            padding: 2px 6px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: normal;
        }

        .memorized-btn {
            background-color: transparent;
            color: var(--magic-green);
            padding: 2px 6px;
            font-size: 13px;
            border: 1px solid var(--magic-green);
            border-radius: 4px;
            margin-left: 5px;
            font-weight: normal;
        }
        .memorized-btn:hover {
            background-color: var(--magic-green);
            color: white;
        }

        .delete-btn {
            background-color: transparent;
            color: #ff3b30;
            padding: 2px 6px;
            font-size: 13px;
            border: 1px solid #ff3b30;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: normal;
            transition: 0.2s;
        }
        .delete-btn:hover {
            background-color: #ff3b30;
            color: white;
        }

        .action-btns {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .phonetic {
            color: #666;
            font-size: 15px;
            font-style: italic;
            margin-left: 5px;
        }

        .history-section h2 {
            color: var(--magic-red);
            font-size: 20px;
            border-bottom: 2px solid var(--magic-red);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 5px;
        }
        .filter-btn {
            padding: 6px 12px;
            font-size: 13px;
            background-color: #666;
        }
        .filter-btn.active {
            background-color: var(--magic-gold);
            color: var(--magic-yellow);
        }
        .refresh-btn {
            padding: 6px 12px;
            font-size: 13px;
            background-color: #333;
        }

        .word-list {
            list-style: none;
            padding: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .word-item {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            font-size: 15px;
            line-height: 1.4;
            transition: 0.3s;
        }

        .word-item.is-memorized {
            background-color: #f0f7f0;
            border-left: 4px solid var(--magic-green);
            opacity: 0.6;
        }
        .word-item.is-memorized strong {
            text-decoration: line-through;
            color: #777;
        }

        .word-item strong {
            color: var(--magic-red);
            display: inline-block;
            margin-bottom: 3px;
        }
        
        .word-item .meaning-text {
            color: #444;
            display: block;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Hogwarts Translate Book</h1>
    
    <div class="search-box">
        <input type="text" id="wordInput" placeholder="영어 단어나 문장을 입력하세요..." autofocus>
        <button id="micBtn" class="mic-btn" onclick="startSpeechRecognition()">🎙️</button>
        <button onclick="searchAndTranslate()">번역 및 저장</button>
    </div>

    <div class="result-box" id="resultBox">
        마이크 버튼을 누르고 영어로 말씀하시면 텍스트로 자동 입력됩니다!
    </div>

    <div class="history-section">
        <h2>
            <span>📜 마법의 복습 노트</span>
            <button class="refresh-btn" onclick="loadHistory()">새로고침</button>
        </h2>
        
        <div class="filter-toolbar">
            <div>
                <button id="filterAll" class="filter-btn active" onclick="setFilter('all')">전체 보기</button>
                <button id="filterIng" class="filter-btn" onclick="setFilter('ing')">미암기 단어</button>
                <button id="filterDone" class="filter-btn" onclick="setFilter('done')">외운 단어 목록</button>
            </div>
            <button class="refresh-btn" style="background-color: #888;" onclick="resetMemorized()">암기 초기화</button>
        </div>

        <ul class="word-list" id="wordList">
            <li>데이터를 불러오는 중...</li>
        </ul>
    </div>
</div>

<script>
    // 💡 여기에 본인의 구글 웹앱 URL을 꼭 적어주세요!
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby0XMdrSFZAuilhm1ZQyR7OwKFR6tHZAA5JillrIIiS2kRk2ypxwE0YOARM5zd2o3Pg/exec';
    let currentAudio = null;
    let currentFilter = 'all'; 
    let serverData = []; 

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
            const speechToText = event.results[0][0].transcript;
            document.getElementById('wordInput').value = speechToText; 
            searchAndTranslate();
        };

        recognition.onend = () => {
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('recording');
            micBtn.innerText = '🎙️';
        };

        recognition.onerror = (event) => { console.error(event); };
    }

    function startSpeechRecognition() {
        if (!recognition) {
            alert('이 브라우저는 음성 인식을 지원하지 않습니다.');
            return;
        }
        const micBtn = document.getElementById('micBtn');
        if (micBtn.classList.contains('recording')) {
            recognition.stop();
        } else {
            micBtn.classList.add('recording');
            micBtn.innerText = '🛑';
            recognition.start();
        }
    }

    function playAudio(url) {
        if(currentAudio) currentAudio.pause();
        currentAudio = new Audio(url);
        currentAudio.play().catch(err => console.log(err));
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; 
            window.speechSynthesis.speak(utterance);
        }
    }

    // 🌐 네이버 사전 팝업 오픈 마법 함수
    function openNaverDictionary(word) {
        const cleanWord = word.trim();
        const naverUrl = `https://en.dict.naver.com/#/search?query=${encodeURIComponent(cleanWord)}`;
        window.open(naverUrl, '_blank', 'width=1000,height=800,scrollbars=yes');
    }

    function getMemorizedWords() {
        const stored = localStorage.getItem('memorizedWords');
        return stored ? JSON.parse(stored) : [];
    }

    function toggleMemorize(word) {
        let memorized = getMemorizedWords();
        if (memorized.includes(word)) {
            memorized = memorized.filter(w => w !== word);
        } else {
            memorized.push(word);
        }
        localStorage.setItem('memorizedWords', JSON.stringify(memorized));
        renderList();
    }

    function resetMemorized() {
        if(confirm("외운 단어 기록을 전부 초기화할까요?")) {
            localStorage.removeItem('memorizedWords');
            renderList();
        }
    }

    function setFilter(filterType) {
        currentFilter = filterType;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if(filterType === 'all') document.getElementById('filterAll').classList.add('active');
        if(filterType === 'ing') document.getElementById('filterIng').classList.add('active');
        if(filterType === 'done') document.getElementById('filterDone').classList.add('active');
        renderList();
    }

    async function searchAndTranslate() {
        const input = document.getElementById('wordInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        if (!input) {
            alert('내용을 입력해주세요!');
            return;
        }

        resultBox.innerHTML = `<h3>${input}</h3><p style="color:gray;">호그와트 도서관에서 뜻을 찾는 중...</p>`;
        
        let phonetic = '';  
        let audioUrl = '';  

        if (!input.includes(' ')) {
            try {
                const dictResponse = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${input}`);
                if (dictResponse.ok) {
                    const dictData = await dictResponse.json();
                    if (dictData && dictData[0]) {
                        phonetic = dictData[0].phonetic || (dictData[0].phonetics && dictData[0].phonetics.find(p => p.text)?.text) || '';
                        const audioObj = dictData[0].phonetics ? dictData[0].phonetics.find(p => p.audio && p.audio !== '') : null;
                        if (audioObj) audioUrl = audioObj.audio;
                    }
                }
            } catch (e) { console.log('사전 API 없음'); }
        }

        try {
            const searchUrl = `${WEB_APP_URL}?word=${encodeURIComponent(input)}`;
            const response = await fetch(searchUrl);
            const data = await response.json();
            
            let translatedText = data.definition;
            if (!translatedText || translatedText === "undefined") {
                translatedText = "뜻을 가져오지 못했습니다.";
            }
            
            const safeWord = input.replace(/'/g, "\\'");
            let resultHtml = `<h3>${input}`;
            if (phonetic) resultHtml += `<span class="phonetic">${phonetic}</span>`;
            
            // 발음 버튼
            if (audioUrl) {
                resultHtml += `<button class="pronounce-btn" onclick="playAudio('${audioUrl}')">🔊 듣기</button>`;
            } else {
                resultHtml += `<button class="pronounce-btn" onclick="speakText('${safeWord}')">🔊 듣기</button>`;
            }
            
            // 🟢 네이버 사전 이동 버튼 추가
            resultHtml += `<button class="naver-btn" onclick="openNaverDictionary('${safeWord}')">🟢 네이버 사전</button>`;
            resultHtml += `</h3><p style="color:var(--magic-red); font-weight:bold;">뜻: ${translatedText}</p>`;
            
            resultBox.innerHTML = resultHtml + `<p style="font-size:12px; color:gray;">구글 시트에 동기화 중...</p>`;
            
            const saveDefinition = phonetic ? `${phonetic} | ${translatedText}` : translatedText;
            
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word: input, definition: saveDefinition })
            });
            
            resultBox.innerHTML = resultHtml + `<span style="color:green; font-size:12px;">✓ 처리 및 시트 저장 완료!</span>`;
            document.getElementById('wordInput').value = '';
            setTimeout(loadHistory, 1000);
            
        } catch (error) {
            console.error(error);
            resultBox.innerHTML = `<span style="color:red;">오류가 발생했습니다.</span>`;
        }
    }

    async function loadHistory() {
        const wordList = document.getElementById('wordList');
        wordList.innerHTML = '<li>복습 노트를 펼치는 중...</li>';
        try {
            const response = await fetch(WEB_APP_URL);
            serverData = await response.json();
            renderList();
        } catch (error) {
            console.error(error);
            wordList.innerHTML = '<li>목록을 불러오지 못했습니다.</li>';
        }
    }

    function renderList() {
        const wordList = document.getElementById('wordList');
        wordList.innerHTML = '';

        if(!serverData || serverData.length === 0) {
            wordList.innerHTML = '<li>아직 저장된 단어가 없습니다.</li>';
            return;
        }

        const memorizedList = getMemorizedWords();
        let displayData = [...serverData].reverse();

        if (currentFilter === 'ing') {
            displayData = displayData.filter(item => !memorizedList.includes(item.word));
        } else if (currentFilter === 'done') {
            displayData = displayData.filter(item => memorizedList.includes(item.word));
        }

        if(displayData.length === 0) {
            wordList.innerHTML = '<li>해당 조건의 단어가 없습니다.</li>';
            return;
        }

        displayData.forEach(item => {
            const isMemorized = memorizedList.includes(item.word);
            const li = document.createElement('li');
            li.className = `word-item ${isMemorized ? 'is-memorized' : ''}`;
            
            const safeWord = item.word.replace(/'/g, "\\'");
            const memoBtnText = isMemorized ? "✓ 암기완료" : "⬜ 암기하기";

            li.innerHTML = `
                <div class="item-header">
                    <div>
                        <strong>🔮 ${item.word}</strong>
                        <button class="history-audio-btn" onclick="speakText('${safeWord}')">🔊 발음</button>
                        <button class="naver-btn" style="padding: 2px 6px !important; font-size: 11px !important;" onclick="openNaverDictionary('${safeWord}')">🟢 사전</button>
                    </div>
                    <div class="action-btns">
                        <button class="memorized-btn" onclick="toggleMemorize('${safeWord}')">${memoBtnText}</button>
                        <button class="delete-btn" onclick="deleteWord('${safeWord}')">🗑️ 삭제</button>
                    </div>
                </div>
                <span class="meaning-text">뜻: ${item.definition}</span>
            `;
            wordList.appendChild(li);
        });
    }

    async function deleteWord(word) {
        if (!confirm(`'${word}' 단어를 삭제할까요?`)) return;

        const wordList = document.getElementById('wordList');
        wordList.innerHTML = '<li>🪄 단어를 소멸시키는 중...</li>';

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "DELETE", word: word })
            });
            
            let memorized = getMemorizedWords();
            memorized = memorized.filter(w => w !== word);
            localStorage.setItem('memorizedWords', JSON.stringify(memorized));
            
            alert("🔥 소멸 마법이 정상 작동했습니다.");
            setTimeout(loadHistory, 1000);
        } catch (error) {
            console.error(error);
            loadHistory();
        }
    }

    window.onload = loadHistory;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호그와트 마법 단어장 (번역+발음)</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --magic-red: #740001;
            --magic-gold: #ae0001;
            --magic-yellow: #eeba30;
            --magic-dark: #1a1a1a;
            --magic-bg: #f4ebd9;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--magic-bg);
            color: var(--magic-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 3px double var(--magic-red);
        }

        h1 {
            text-align: center;
            color: var(--magic-red);
            font-variant: small-caps;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--magic-red);
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            background-color: var(--magic-red);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background-color: var(--magic-gold);
            color: var(--magic-yellow);
        }

        .result-box {
            background: #faf6ee;
            padding: 15px;
            border-left: 5px solid var(--magic-yellow);
            margin-bottom: 30px;
            border-radius: 4px;
            min-height: 60px;
        }

        /* 🔊 발음 버튼 스타일 */
        .pronounce-btn {
            background-color: var(--magic-yellow);
            color: var(--magic-dark);
            padding: 4px 8px;
            font-size: 14px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .pronounce-btn:hover {
            background-color: var(--magic-red);
            color: white;
        }

        .phonetic {
            color: #666;
            font-size: 15px;
            font-style: italic;
            margin-left: 5px;
        }

        .history-section h2 {
            color: var(--magic-red);
            font-size: 20px;
            border-bottom: 2px solid var(--magic-red);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .refresh-btn {
            padding: 5px 10px;
            font-size: 12px;
            background-color: #555;
        }

        .word-list {
            list-style: none;
            padding: 0;
            max-height: 350px;
            overflow-y: auto;
        }

        .word-item {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            font-size: 15px;
            line-height: 1.4;
        }

        .word-item strong {
            color: var(--magic-red);
            display: block;
            margin-bottom: 3px;
        }
        
        .word-item span {
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Hogwarts Translate Book</h1>
    
    <div class="search-box">
        <input type="text" id="wordInput" placeholder="영어 단어나 문장을 입력하세요..." autofocus>
        <button onclick="searchAndTranslate()">번역 및 저장</button>
    </div>

    <div class="result-box" id="resultBox">
        단어를 입력하면 한글 뜻, 발음기호가 출력되며 스피커 버튼을 눌러 발음을 들을 수 있습니다!
    </div>

    <div class="history-section">
        <h2>
            <span>📜 마법의 복습 노트</span>
            <button class="refresh-btn" onclick="loadHistory()">새로고침</button>
        </h2>
        <ul class="word-list" id="wordList">
            <li>데이터를 불러오는 중...</li>
        </ul>
    </div>
</div>

<script>
    // 💡 [중요] 여기에 내 구글 웹앱 URL을 입력하세요!
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzxVK8SVSFefXja2eS1rizrntM9aXgvPIK0l5grXmjRfTnfc4oTg6gEpZ8ls8LWE9kh9g/exec';
    let currentAudio = null; // 오디오 객체 저장용 변수

    // 오디오 재생 마법 함수
    function playAudio(url) {
        if(currentAudio) currentAudio.pause();
        currentAudio = new Audio(url);
        currentAudio.play();
    }

    // 단어 검색 및 번역 + 발음 가져오기
    async function searchAndTranslate() {
        const input = document.getElementById('wordInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        if (!input) {
            alert('내용을 입력해주세요!');
            return;
        }

        resultBox.innerHTML = `<h3>${input}</h3><p style="color:gray;">호그와트 도서관에서 발음과 뜻을 찾는 중...</p>`;
        
        let phonetic = '';  // 발음 기호
        let audioUrl = '';  // 발음 오디오 주소

        // 1. 단어일 경우 사전 API에서 발음기호와 오디오 주소 먼저 조회 (공백이 없는 단어일 때만)
        if (!input.includes(' ')) {
            try {
                const dictResponse = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${input}`);
                if (dictResponse.ok) {
                    const dictData = await dictResponse.ok ? await dictResponse.json() : null;
                    if (dictData && dictData[0]) {
                        // 발음기호 추출
                        phonetic = dictData[0].phonetic || (dictData[0].phonetics && dictData[0].phonetics.find(p => p.text)?.text) || '';
                        
                        // 오디오 주소 추출 (오디오 파일 주소가 존재하는지 검사)
                        const audioObj = dictData[0].phonetics ? dictData[0].phonetics.find(p => p.audio && p.audio !== '') : null;
                        if (audioObj) audioUrl = audioObj.audio;
                    }
                }
            } catch (e) {
                console.log('사전 발음 데이터가 없거나 조회 실패 (문장일 수 있음)');
            }
        }

        try {
            // 2. 구글 웹앱에 GET 요청을 보내 실시간 번역 결과 획득
            const searchUrl = `${WEB_APP_URL}?word=${encodeURIComponent(input)}`;
            const response = await fetch(searchUrl);
            const data = await response.json();
            const translatedText = data.definition;
            
            // 3. 화면에 보여줄 결과 구성 (오디오가 있으면 스피커 버튼 추가)
            let resultHtml = `<h3>${input}`;
            if (phonetic) resultHtml += `<span class="phonetic">${phonetic}</span>`;
            if (audioUrl) resultHtml += `<button class="pronounce-btn" onclick="playAudio('${audioUrl}')">🔊 듣기</button>`;
            resultHtml += `</h3><p style="color:var(--magic-red); font-weight:bold;">뜻: ${translatedText}</p>`;
            
            resultBox.innerHTML = resultHtml + `<p style="font-size:12px; color:gray;">구글 시트에 저장하는 중...</p>`;
            
            // 4. 구글 시트 저장 (발음기호가 있으면 뜻 옆에 같이 저장해 줍니다)
            const saveDefinition = phonetic ? `${phonetic} | ${translatedText}` : translatedText;
            
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word: input, definition: saveDefinition })
            });
            
            resultBox.innerHTML = resultHtml + `<span style="color:green; font-size:12px;">✓ 발음 확인 및 시트 저장 완료!</span>`;
            document.getElementById('wordInput').value = '';

            setTimeout(loadHistory, 1000);
            
        } catch (error) {
            console.error(error);
            resultBox.innerHTML = `<span style="color:red;">오류가 발생했습니다. 웹앱 URL을 확인하세요.</span>`;
        }
    }

    // 구글 시트 복습 목록 가져오기
    async function loadHistory() {
        const wordList = document.getElementById('wordList');
        wordList.innerHTML = '<li>복습 노트를 펼치는 중...</li>';

        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();
            
            wordList.innerHTML = '';
            if(data.length === 0) {
                wordList.innerHTML = '<li>아직 저장된 단어가 없습니다.</li>';
                return;
            }

            data.reverse().forEach(item => {
                const li = document.createElement('li');
                li.className = 'word-item';
                li.innerHTML = `<strong>🔮 ${item.word}</strong><span>뜻: ${item.definition}</span>`;
                wordList.appendChild(li);
            });
        } catch (error) {
            console.error(error);
            wordList.innerHTML = '<li>목록을 불러오지 못했습니다.</li>';
        }
    }

    window.onload = loadHistory;

    // 서비스 워커 등록
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('지팡이 등록 완료:', reg.scope))
                .catch(err => console.log('마법 실패:', err));
        });
    }
</script>
</body>
</html>

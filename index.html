<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호그와트 마법 단어장 (최종 완결판)</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --magic-red: #740001;
            --magic-gold: #ae0001;
            --magic-yellow: #eeba30;
            --magic-dark: #1a1a1a;
            --magic-bg: #f4ebd9;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--magic-bg);
            color: var(--magic-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 3px double var(--magic-red);
        }

        h1 {
            text-align: center;
            color: var(--magic-red);
            font-variant: small-caps;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--magic-red);
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background-color: var(--magic-red);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--magic-gold);
            color: var(--magic-yellow);
        }

        .mic-btn {
            background-color: #555;
            padding: 12px 15px;
        }
        .mic-btn.recording {
            background-color: #ff3b30;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0 { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .result-box {
            background: #faf6ee;
            padding: 15px;
            border-left: 5px solid var(--magic-yellow);
            margin-bottom: 30px;
            border-radius: 4px;
            min-height: 60px;
        }

        .pronounce-btn {
            background-color: var(--magic-yellow);
            color: var(--magic-dark);
            padding: 4px 8px;
            font-size: 14px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .pronounce-btn:hover {
            background-color: var(--magic-red);
            color: white;
        }

        /* 📜 복습 노트를 위한 작은 스피커 버튼 디자인 */
        .history-audio-btn {
            background-color: transparent;
            color: var(--magic-dark);
            padding: 2px 6px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: normal;
        }
        .history-audio-btn:hover {
            background-color: var(--magic-yellow);
            color: var(--magic-dark);
            border-color: var(--magic-yellow);
        }

        .phonetic {
            color: #666;
            font-size: 15px;
            font-style: italic;
            margin-left: 5px;
        }

        .history-section h2 {
            color: var(--magic-red);
            font-size: 20px;
            border-bottom: 2px solid var(--magic-red);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .refresh-btn {
            padding: 5px 10px;
            font-size: 12px;
            background-color: #555;
        }

        .word-list {
            list-style: none;
            padding: 0;
            max-height: 350px;
            overflow-y: auto;
        }

        .word-item {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            font-size: 15px;
            line-height: 1.4;
        }

        .word-item strong {
            color: var(--magic-red);
            display: inline-block;
            margin-bottom: 3px;
        }
        
        .word-item span {
            color: #444;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Hogwarts Translate Book</h1>
    
    <div class="search-box">
        <input type="text" id="wordInput" placeholder="영어 단어나 문장을 입력하세요..." autofocus>
        <button id="micBtn" class="mic-btn" onclick="startSpeechRecognition()">🎙️</button>
        <button onclick="searchAndTranslate()">번역 및 저장</button>
    </div>

    <div class="result-box" id="resultBox">
        마이크 버튼을 누르고 영어로 말씀하시면 텍스트로 자동 입력됩니다!
    </div>

    <div class="history-section">
        <h2>
            <span>📜 마법의 복습 노트</span>
            <button class="refresh-btn" onclick="loadHistory()">새로고침</button>
        </h2>
        <ul class="word-list" id="wordList">
            <li>데이터를 불러오는 중...</li>
        </ul>
    </div>
</div>

<script>
    // 💡 [중요] 여기에 내 구글 웹앱 URL을 입력하세요!
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzxVK8SVSFefXja2eS1rizrntM9aXgvPIK0l5grXmjRfTnfc4oTg6gEpZ8ls8LWE9kh9g/exec';
    let currentAudio = null;

    // 🎙️ 음성 인식(Speech Recognition) 설정
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
            const speechToText = event.results[0][0].transcript;
            document.getElementById('wordInput').value = speechToText; 
            searchAndTranslate();
        };

        recognition.onend = () => {
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('recording');
            micBtn.innerText = '🎙️';
        };

        recognition.onerror = (event) => {
            console.error('음성 인식 에러:', event.error);
            alert('음성을 인식하지 못했습니다. 마이크 권한을 확인해 주세요!');
        };
    }

    function startSpeechRecognition() {
        if (!recognition) {
            alert('이 브라우저나 기기는 음성 인식을 지원하지 않습니다. (크롬/사파리 권장)');
            return;
        }
        
        const micBtn = document.getElementById('micBtn');
        if (micBtn.classList.contains('recording')) {
            recognition.stop();
        } else {
            micBtn.classList.add('recording');
            micBtn.innerText = '🛑';
            recognition.start();
        }
    }

    // 🔊 오디오 재생 마법 함수
    function playAudio(url) {
        if(currentAudio) currentAudio.pause();
        currentAudio = new Audio(url);
        currentAudio.play().catch(err => {
            console.log("오디오 재생 실패:", err);
            // 만약 브라우저 보안 정책으로 막히면 대체 수단으로 기기 자체 TTS(읽어주기) 실행
            const ttsWord = url; // 이 함수가 단어 텍스트를 직접 받았을 때의 예외처리
            if(typeof url === 'string' && !url.startsWith('http')) {
                speakText(url);
            }
        });
    }

    // 🗣️ 스마트폰 내장 음성(TTS) 읽어주기 마법 함수 (문장이나 오디오 주소가 없을 때 사용)
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // 켜져있는 음성 끄기
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; // 영어 발음
            window.speechSynthesis.speak(utterance);
        } else {
            alert('이 기기는 말하기 기능을 지원하지 않습니다.');
        }
    }

    // 단어 검색 및 번역 + 발음 가져오기
    async function searchAndTranslate() {
        const input = document.getElementById('wordInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        if (!input) {
            alert('내용을 입력해주세요!');
            return;
        }

        resultBox.innerHTML = `<h3>${input}</h3><p style="color:gray;">호그와트 도서관에서 발음과 뜻을 찾는 중...</p>`;
        
        let phonetic = '';  
        let audioUrl = '';  

        if (!input.includes(' ')) {
            try {
                const dictResponse = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${input}`);
                if (dictResponse.ok) {
                    const dictData = await dictResponse.json();
                    if (dictData && dictData[0]) {
                        phonetic = dictData[0].phonetic || (dictData[0].phonetics && dictData[0].phonetics.find(p => p.text)?.text) || '';
                        const audioObj = dictData[0].phonetics ? dictData[0].phonetics.find(p => p.audio && p.audio !== '') : null;
                        if (audioObj) audioUrl = audioObj.audio;
                    }
                }
            } catch (e) {
                console.log('사전 데이터 없음');
            }
        }

        try {
            const searchUrl = `${WEB_APP_URL}?word=${encodeURIComponent(input)}`;
            const response = await fetch(searchUrl);
            const data = await response.json();
            const translatedText = data.definition;
            
            let resultHtml = `<h3>${input}`;
            if (phonetic) resultHtml += `<span class="phonetic">${phonetic}</span>`;
            
            // 실시간 오디오가 있으면 원어민 오디오 연동, 없으면 스마트폰 자체 음성 엔진(TTS) 연동
            if (audioUrl) {
                resultHtml += `<button class="pronounce-btn" onclick="playAudio('${audioUrl}')">🔊 듣기</button>`;
            } else {
                // 문장이거나 특수 단어인 경우 기기 TTS 마법 사용
                resultHtml += `<button class="pronounce-btn" onclick="speakText('${input.replace(/'/g, "\\'")}')">🔊 듣기</button>`;
            }
            
            resultHtml += `</h3><p style="color:var(--magic-red); font-weight:bold;">뜻: ${translatedText}</p>`;
            resultBox.innerHTML = resultHtml + `<p style="font-size:12px; color:gray;">구글 시트에 저장하는 중...</p>`;
            
            const saveDefinition = phonetic ? `${phonetic} | ${translatedText}` : translatedText;
            
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word: input, definition: saveDefinition })
            });
            
            resultBox.innerHTML = resultHtml + `<span style="color:green; font-size:12px;">✓ 처리 및 시트 저장 완료!</span>`;
            document.getElementById('wordInput').value = '';

            setTimeout(loadHistory, 1000);
            
        } catch (error) {
            console.error(error);
            resultBox.innerHTML = `<span style="color:red;">오류가 발생했습니다. 웹앱 URL을 확인하세요.</span>`;
        }
    }

    // 구글 시트 복습 목록 가져오기
    async function loadHistory() {
        const wordList = document.getElementById('wordList');
        wordList.innerHTML = '<li>복습 노트를 펼치는 중...</li>';

        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();
            
            wordList.innerHTML = '';
            if(data.length === 0) {
                wordList.innerHTML = '<li>아직 저장된 단어가 없습니다.</li>';
                return;
            }

            data.reverse().forEach(item => {
                const li = document.createElement('li');
                li.className = 'word-item';
                
                // 작은 따옴표 문자가 에러를 일으키지 않도록 안전 조치
                const safeWord = item.word.replace(/'/g, "\\'");
                
                // 📜 복습 목록의 각 단어 옆에도 스피커 버튼을 달아줍니다! 문장도 읽어주기 위해 기기 내장 TTS(speakText)로 연동합니다.
                li.innerHTML = `
                    <div>
                        <strong>🔮 ${item.word}</strong>
                        <button class="history-audio-btn" onclick="speakText('${safeWord}')">🔊 발음</button>
                    </div>
                    <span>뜻: ${item.definition}</span>
                `;
                wordList.appendChild(li);
            });
        } catch (error) {
            console.error(error);
            wordList.innerHTML = '<li>목록을 불러오지 못했습니다.</li>';
        }
    }

    window.onload = loadHistory;

    // 서비스 워커 등록
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('지팡이 등록 완료:', reg.scope))
                .catch(err => console.log('마법 실패:', err));
        });
    }
</script>
</body>
</html>

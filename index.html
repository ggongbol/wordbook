<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호그와트 마법 단어장 (구글 번역)</title>

    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --magic-red: #740001;
            --magic-gold: #ae0001;
            --magic-yellow: #eeba30;
            --magic-dark: #1a1a1a;
            --magic-bg: #f4ebd9;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--magic-bg);
            color: var(--magic-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 3px double var(--magic-red);
        }

        h1 {
            text-align: center;
            color: var(--magic-red);
            font-variant: small-caps;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--magic-red);
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            background-color: var(--magic-red);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background-color: var(--magic-gold);
            color: var(--magic-yellow);
        }

        .result-box {
            background: #faf6ee;
            padding: 15px;
            border-left: 5px solid var(--magic-yellow);
            margin-bottom: 30px;
            border-radius: 4px;
            min-height: 60px;
        }

        .history-section h2 {
            color: var(--magic-red);
            font-size: 20px;
            border-bottom: 2px solid var(--magic-red);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .refresh-btn {
            padding: 5px 10px;
            font-size: 12px;
            background-color: #555;
        }

        .word-list {
            list-style: none;
            padding: 0;
            max-height: 350px;
            overflow-y: auto;
        }

        .word-item {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            font-size: 15px;
            line-height: 1.4;
        }

        .word-item strong {
            color: var(--magic-red);
            display: block;
            margin-bottom: 3px;
        }
        
        .word-item span {
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Hogwarts Translate Book</h1>
    
    <div class="search-box">
        <input type="text" id="wordInput" placeholder="영어 단어나 문장을 입력하세요...">
        <button onclick="searchAndTranslate()">번역 및 저장</button>
    </div>

    <div class="result-box" id="resultBox">
        영어 단어나 원서 문장을 입력하면 구글 실시간 번역 결과가 나타나고 구글 시트에 자동 저장됩니다.
    </div>

    <div class="history-section">
        <h2>
            <span>📜 마법의 복습 노트</span>
            <button class="refresh-btn" onclick="loadHistory()">새로고침</button>
        </h2>
        <ul class="word-list" id="wordList">
            <li>데이터를 불러오는 중...</li>
        </ul>
    </div>
</div>

<script>
    // 💡 [중요] 여기에 구글 웹앱 URL을 붙여넣으세요!
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzxVK8SVSFefXja2eS1rizrntM9aXgvPIK0l5grXmjRfTnfc4oTg6gEpZ8ls8LWE9kh9g/exec';

    // 단어 검색 및 구글 번역 연동 함수
    async function searchAndTranslate() {
        const input = document.getElementById('wordInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        if (!input) {
            alert('내용을 입력해주세요!');
            return;
        }

        resultBox.innerHTML = `<h3>${input}</h3><p style="color:gray;">구글 덤블도어 서버에서 번역 중...</p>`;
        
        try {
            // 1. 구글 스크립트에 GET 요청을 보내 내장 구글 번역 결과 획득
            const searchUrl = `${WEB_APP_URL}?word=${encodeURIComponent(input)}`;
            const response = await fetch(searchUrl);
            const data = await response.json();
            
            const translatedText = data.definition;
            
            resultBox.innerHTML = `<h3>${input}</h3><p style="color:#b58900; font-weight:bold;">뜻: ${translatedText}</p><p style="font-size:12px; color:gray;">구글 시트에 기록하는 중...</p>`;
            
            // 2. 번역된 단어와 뜻을 구글 시트에 최종 기록 (POST)
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word: input, definition: translatedText })
            });
            
            resultBox.innerHTML = `<h3>${input}</h3><p style="color:var(--magic-red); font-weight:bold;">뜻: ${translatedText}</p><span style="color:green; font-size:12px;">✓ 구글 시트 저장 및 복습 노트 반영 완료!</span>`;
            document.getElementById('wordInput').value = ''; // 입력창 비우기

            // 1초 후 아래 목록 새로고침
            setTimeout(loadHistory, 1000);
            
        } catch (error) {
            console.error(error);
            resultBox.innerHTML = `<span style="color:red;">번역 및 저장 중 오류가 발생했습니다. 웹앱 URL을 확인하세요.</span>`;
        }
    }

    // 구글 시트에서 여태껏 저장된 복습 목록 가져오기
    async function loadHistory() {
        const wordList = document.getElementById('wordList');
        wordList.innerHTML = '<li>복습 노트를 펼치는 중...</li>';

        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();
            
            wordList.innerHTML = '';
            if(data.length === 0) {
                wordList.innerHTML = '<li>아직 저장된 단어나 문장이 없습니다.</li>';
                return;
            }

            // 최신 검색어가 위로 오도록 정렬
            data.reverse().forEach(item => {
                const li = document.createElement('li');
                li.className = 'word-item';
                li.innerHTML = `<strong>🔮 ${item.word}</strong><span>뜻: ${item.definition}</span>`;
                wordList.appendChild(li);
            });
        } catch (error) {
            console.error(error);
            wordList.innerHTML = '<li>목록을 불러오지 못했습니다.</li>';
        }
    }

    // 페이지 시작 시 목록 자동 로드
    window.onload = loadHistory;

</script><script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('지팡이 등록 완료 (서비스 워커 성공):', reg.scope))
                    .catch(err => console.log('마법 실패 (서비스 워커 에러):', err));
            });
        }
    </script>

</body>
</html>
